<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <title>Hivemindz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: monospace; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    
    <script src="Clases/config.js"></script>
    <script src="Clases/utils.js"></script>
    <script src="Clases/input.js"></script>
    <script src="Clases/boids.js"></script>
    <script src="Clases/world.js"></script>
    <script src="Clases/camara.js"></script>
    <script src="Clases/sprites.js"></script>
    <script src="Clases/gameobject.js"></script>
    <script src="Clases/obstacle.js"></script>
    <script src="Clases/estados.js"></script>
    <script src="Clases/player.js"></script>
    <script src="Clases/humano.js"></script>
    <script src="Clases/zombie.js"></script>
    <script src="Clases/bala.js"></script>
    <script src="Clases/enemigo.js"></script>
    <script src="Clases/habilidades.js"></script>
    <script src="Clases/game.js"></script>
</head>
<body>
    <script>
        const gameobject = new Game();
    </script>

    <div id="cooldown-bars" style="
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        gap: 24px;
        align-items: flex-end;
        z-index: 10;
        pointer-events: none;
    ">
        <!-- Health -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
            <div style="
                font-family: monospace; font-size: 10px;
                font-weight: bold; color: #ffffff; letter-spacing: 2px;
                text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
            ">HEALTH</div>
            <div style="
                width: 14px; height: 60px;
                background: rgba(255,255,255,0.1);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 6px;
                overflow: hidden;
                display: flex; align-items: flex-end;
            ">
                <div id="health-bar" style="
                    width: 100%;
                    height: 100%;
                    background: #4caf50;
                    border-radius: 6px;
                    transition: height 0.1s, background 0.3s;
                "></div>
            </div>
        </div>

        <!-- DASH -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
            <div style="
                font-family: monospace; font-size: 10px;
                color: #fff; letter-spacing: 1px;
                text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
            ">DASH</div>
            <div style="
                width: 60px; height: 60px;
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 8px;
                background: rgba(0,0,0,0.5);
                display: flex; align-items: flex-end;
                overflow: hidden;
            ">
                <div id="cd-dash" style="
                    width: 100%;
                    height: 100%;
                    background: #ffb74d;
                    transition: height 0.05s;
                "></div>
            </div>
        </div>

        <!-- LMB -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
            <div style="
                font-family: monospace; font-size: 10px;
                color: #fff; letter-spacing: 1px;
                text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
            ">LMB</div>
            <div style="
                width: 60px; height: 60px;
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 8px;
                background: rgba(0,0,0,0.5);
                display: flex; align-items: flex-end;
                overflow: hidden;
            ">
                <div id="cd-lmb" style="
                    width: 100%;
                    height: 100%;
                    background: #69f0ae;
                    transition: height 0.05s;
                "></div>
            </div>
        </div>

        <!-- RMB -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
            <div style="
                font-family: monospace; font-size: 10px;
                color: #fff; letter-spacing: 1px;
                text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
            ">RMB</div>
            <div style="
                width: 60px; height: 60px;
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 8px;
                background: rgba(0,0,0,0.5);
                display: flex; align-items: flex-end;
                overflow: hidden;
            ">
                <div id="cd-shot" style="
                    width: 100%;
                    height: 100%;
                    background: #69f0ae;
                    transition: height 0.05s;
                "></div>
            </div>
        </div>
    </div>

    <div id="death-screen" style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        color: #ff4444;
        font-family: monospace;
        font-size: 48px;
        font-weight: bold;
        letter-spacing: 4px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        z-index: 100;
    ">
        <div>YOU DIED</div>
        <div style="font-size:16px; color:#aaa; letter-spacing:2px;">refresh to restart</div>
    </div>

    <div id="upgrade-screen" style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.88);
        color: #fff;
        font-family: monospace;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 32px;
        z-index: 200;
    ">
        <div style="font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #69f0ae;">EVOLVE</div>
        <div style="font-size: 13px; color: #aaa; letter-spacing: 2px;">choose one ability</div>
        <div id="upgrade-cards" style="display:flex; gap: 32px;"></div>
    </div>

    <div id="human-counter" style="
        position: fixed;
        top: 20px;
        right: 20px;
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        color: #ffffff;
        letter-spacing: 2px;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        z-index: 10;
        pointer-events: none;
    ">
        HUMANS: 0
    </div>
</body>
</html>
