<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <title>Hivemindz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: monospace; }

        .hud-bar-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hud-bar-label {
            font-family: monospace;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: -1px -1px 0 #000, 1px 1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        .hud-bar-track {
            border-radius: 4px;
            overflow: hidden;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hud-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.15s, background 0.3s;
        }

        .cd-circle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }
        .cd-circle-label {
            font-family: monospace;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: -1px -1px 0 #000, 1px 1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            text-align: right;
            width: 140px;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
            font-size: 9px;
        }
        .cd-circle-svg {
            position: relative;
            flex-shrink: 0;
        }
        .cd-circle-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: -1px -1px 0 #000, 1px 1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="Clases/config.js"></script>
    <script src="Clases/utils.js"></script>
    <script src="Clases/input.js"></script>
    <script src="Clases/boids.js"></script>
    <script src="Clases/world.js"></script>
    <script src="Clases/camara.js"></script>
    <script src="Clases/sprites.js"></script>
    <script src="Clases/gameobject.js"></script>
    <script src="Clases/obstacle.js"></script>
    <script src="Clases/estados.js"></script>
    <script src="Clases/player.js"></script>
    <script src="Clases/zombie.js"></script>
    <script src="Clases/humano.js"></script>
    <script src="Clases/bala.js"></script>
    <script src="Clases/enemigo.js"></script>
    <script src="Clases/habilidades.js"></script>
    <script src="Clases/game.js"></script>
</head>
<body>
    <script>const gameobject = new Game();</script>

    <!-- ── Menú principal ──────────────────────────────────────────────── -->
    <div id="menu-screen" style="
        display:flex; position:fixed; inset:0;
        background:#000; color:#fff; font-family:monospace;
        align-items:center; justify-content:center;
        flex-direction:column; gap:32px; z-index:300;
    ">
        <div style="font-size:36px;font-weight:bold;letter-spacing:6px;color:#69f0ae;">HIVEMINDZ</div>
        <div style="display:flex;flex-direction:column;gap:16px;align-items:center;">
            <button onclick="startGame('normal')" style="
                font-family:monospace;font-size:16px;font-weight:bold;
                letter-spacing:3px;padding:14px 40px;
                background:transparent;color:#69f0ae;
                border:2px solid #69f0ae;border-radius:8px;cursor:pointer;
            " onmouseover="this.style.background='rgba(105,240,174,0.15)'"
               onmouseout="this.style.background='transparent'">NORMAL MODE</button>
            <button onclick="startGame('waves')" style="
                font-family:monospace;font-size:16px;font-weight:bold;
                letter-spacing:3px;padding:14px 40px;
                background:transparent;color:#ffb74d;
                border:2px solid #ffb74d;border-radius:8px;cursor:pointer;
            " onmouseover="this.style.background='rgba(255,183,77,0.15)'"
               onmouseout="this.style.background='transparent'">WAVES MODE</button>
        </div>
    </div>

    <!-- ── HUD izquierda: salud + XP ───────────────────────────────────── -->
    <div id="hud-left" style="
        display:none; position:fixed; top:20px; left:20px;
        flex-direction:column; gap:8px;
        z-index:10; pointer-events:none;
    ">
        <div class="hud-bar-wrap">
            <div id="label-health" class="hud-bar-label">HEALTHY</div>
            <div class="hud-bar-track" style="width:300px;height:20px;">
                <div id="health-bar" class="hud-bar-fill" style="width:100%;background:#850a0a;"></div>
            </div>
        </div>
        <div class="hud-bar-wrap">
            <div id="label-xp" class="hud-bar-label">XP</div>
            <div class="hud-bar-track" style="width:260px;height:12px;">
                <div id="xp-bar" class="hud-bar-fill" style="width:0%;background:#1b5e20;"></div>
            </div>
        </div>
    </div>

    <!-- ── HUD derecha: cooldowns ───────────────────────────────────────── -->
    <div id="hud-right" style="
        display:none; position:fixed; top:20px; right:20px;
        flex-direction:column; gap:12px; align-items:flex-end;
        z-index:10; pointer-events:none;
    ">
        <div class="cd-circle-wrap">
            <div id="label-lmb-ability" class="cd-circle-label">—</div>
            <div class="cd-circle-svg">
                <svg id="svg-lmb" width="120" height="120" style="transform:rotate(-90deg);">
                    <circle cx="60" cy="60" r="50" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                    <circle id="arc-lmb" cx="60" cy="60" r="50" fill="none" stroke="#ffee00" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"/>
                </svg>
                <div id="label-lmb-center" class="cd-circle-text">LMB</div>
            </div>
        </div>
        <div class="cd-circle-wrap">
            <div id="label-rmb-ability" class="cd-circle-label">—</div>
            <div class="cd-circle-svg">
                <svg id="svg-rmb" width="120" height="120" style="transform:rotate(-90deg);">
                    <circle cx="60" cy="60" r="50" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                    <circle id="arc-rmb" cx="60" cy="60" r="50" fill="none" stroke="#00e676" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"/>
                </svg>
                <div id="label-rmb-center" class="cd-circle-text">RMB</div>
            </div>
        </div>
        <div class="cd-circle-wrap">
            <div id="label-dash-ability" class="cd-circle-label">DASH</div>
            <div class="cd-circle-svg">
                <svg id="svg-dash" width="120" height="120" style="transform:rotate(-90deg);">
                    <circle cx="60" cy="60" r="50" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                    <circle id="arc-dash" cx="60" cy="60" r="50" fill="none" stroke="#ffb74d" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round"/>
                </svg>
                <div id="label-dash-center" class="cd-circle-text">DASH</div>
            </div>
        </div>
    </div>

    <!-- ── Barra central de población ──────────────────────────────────── -->
    <div id="population-bar-wrap" style="
        display:none; position:fixed; top:18px; left:50%; transform:translateX(-50%);
        z-index:20; pointer-events:none;
        background:transparent;
        border:1px solid rgba(255,255,255,0.15);
        border-radius:10px;
        padding:6px 14px 8px;
        flex-direction:column;
        align-items:center;
        gap:4px;
        min-width:600px;
    ">
        <div style="display:flex;justify-content:space-between;width:100%;font-family:monospace;font-size:30px;letter-spacing:2px;">
            <span id="pop-count-humans"  style="-webkit-text-stroke:0.5px #000;text-shadow:-1px -1px 0 #000,1px 1px 0 #000;">HUMANS 0</span>
            <span id="pop-count-zombies" style="-webkit-text-stroke:0.5px #000;text-shadow:-1px -1px 0 #000,1px 1px 0 #000;">ZOMBIES 0</span>
            <span id="pop-count-forces"  style="-webkit-text-stroke:0.5px #000;text-shadow:-1px -1px 0 #000,1px 1px 0 #000;">FORCES 0</span>
        </div>
        <div style="width:100%;height:10px;border-radius:5px;overflow:hidden;display:flex;">
            <div id="pop-humans"  style="height:100%;transition:width 0.4s;width:100%;"></div>
            <div id="pop-zombies" style="height:100%;transition:width 0.4s;width:0%;"></div>
            <div id="pop-forces"  style="height:100%;transition:width 0.4s;width:0%;"></div>
        </div>
    </div>

    <!-- ── Timer de inicio ──────────────────────────────────────────────── -->
    <div id="start-timer" style="
        display:none; position:fixed; top:18px; left:50%; transform:translateX(-50%);
        font-family:monospace; font-size:22px; font-weight:bold;
        color:#fff; letter-spacing:3px;
        -webkit-text-stroke:0.5px #000;
        text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        z-index:30; pointer-events:none;
        background:rgba(0,0,0,0.55);
        border:1px solid rgba(255,255,255,0.15);
        border-radius:10px;
        padding:6px 20px;
    ">TRANSFORMING IN: 15s</div>

    <!-- ── Info de waves ───────────────────────────────────────────────── -->
    <div id="wave-counter" style="
        display:none; position:fixed; top:100px; left:50%; transform:translateX(-50%);
        font-family:monospace; font-weight:bold;
        color:#fff; letter-spacing:3px;
        -webkit-text-stroke:0.5px #000;
        text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        z-index:10; pointer-events:none;
        white-space:nowrap;
    ">WAVE 1/9</div>

    <!-- ── Pantallas de estado ──────────────────────────────────────────── -->
    <div id="death-screen" style="
        display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.85); color:#ff4444;
        font-family:monospace; font-size:48px; font-weight:bold; letter-spacing:4px;
        align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:100;
    ">
        <div>YOU DIED</div>
        <div style="font-size:16px;color:#aaa;letter-spacing:2px;">the infection ends here</div>
        <button onclick="volverAlMenu()" style="margin-top:16px;font-family:monospace;font-size:14px;letter-spacing:2px;padding:10px 28px;background:transparent;color:#ff4444;border:2px solid #ff4444;border-radius:8px;cursor:pointer;">BACK TO MENU</button>
    </div>

    <div id="victory-screen" style="
        display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.88); color:#69f0ae;
        font-family:monospace; font-size:48px; font-weight:bold; letter-spacing:4px;
        align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:100;
    ">
        <div>YOU WIN</div>
        <div style="font-size:16px;color:#aaa;letter-spacing:2px;">the world is yours</div>
        <button onclick="volverAlMenu()" style="margin-top:16px;font-family:monospace;font-size:14px;letter-spacing:2px;padding:10px 28px;background:transparent;color:#69f0ae;border:2px solid #69f0ae;border-radius:8px;cursor:pointer;">BACK TO MENU</button>
    </div>

    <div id="upgrade-screen" style="
        display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.88); color:#fff; font-family:monospace;
        align-items:center; justify-content:center; flex-direction:column; gap:32px; z-index:200;
    ">
        <div id="upgrade-title" style="font-weight:bold;letter-spacing:4px;color:#69f0ae;">EVOLVE</div>
        <div style="font-size:13px;color:#aaa;letter-spacing:2px;">choose one ability</div>
        <div id="upgrade-cards" style="display:flex;gap:32px;"></div>
    </div>

    <!-- ── Scripts ─────────────────────────────────────────────────────── -->
    <script>
        function startGame(mode) {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('start-timer').style.display = 'block';
            Game.instance._gameMode = mode;
            if (mode === 'waves') {
                document.getElementById('wave-counter').style.display = 'block';
                Game.instance._waveMode         = true;
                Game.instance._waveNumber       = 1;
                Game.instance._waveTimer        = Config.waveDuration;
                Game.instance._waveUpgradeTimer = Config.waveUpgradeEvery;
                Game.instance._mostrarUpgrade();
            }
        }

        function volverAlMenu() { location.reload(); }

        function initCirculos() {
            const r      = Config.hudCooldownRadius;
            const size   = r * 2;
            const rInner = r * 0.83;
            const circ   = +(2 * Math.PI * rInner).toFixed(2);

            ['lmb', 'rmb', 'dash'].forEach(id => {
                const svg = document.getElementById('svg-' + id);
                if (!svg) return;
                svg.setAttribute('width',  size);
                svg.setAttribute('height', size);
                svg.querySelectorAll('circle').forEach(c => {
                    c.setAttribute('cx', r);
                    c.setAttribute('cy', r);
                    c.setAttribute('r',  rInner);
                });
                const arc = document.getElementById('arc-' + id);
                if (arc) {
                    arc.setAttribute('stroke-dasharray',  circ);
                    arc.setAttribute('stroke-dashoffset', circ);
                }
            });

            // Fuente desde config
            const fs     = Config.hudFontSize + 'px';
            const fsLarge = Config.hudFontSizeLarge + 'px';
            document.querySelectorAll('.hud-bar-label').forEach(el => el.style.fontSize = fs);
            document.querySelectorAll('.cd-circle-label').forEach(el => el.style.fontSize = fsLarge);
            document.querySelectorAll('.cd-circle-text').forEach(el => el.style.fontSize = fs);

            // Ancho de barras desde config
            const hw = Config.hudBarWidth + 'px';
            const htrack = document.querySelector('#hud-left .hud-bar-track');
            if (htrack) htrack.style.width = hw;

            document.getElementById('upgrade-title').style.fontSize = Config.upgradeScreenTitleSize + 'px';
            const wc = document.getElementById('wave-counter');
            if (wc) wc.style.fontSize = Config.waveCounterFontSize + 'px';
        }

        window.addEventListener('load', () => setTimeout(initCirculos, 100));
    </script>
</body>
</html>
